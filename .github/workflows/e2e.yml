name: E2E (UI + API)

on:
  schedule:
    # GitHub interpreta el cron en UTC. Argentina es UTC-3 todo el año (sin horario de verano):
    # lunes 15:00 ART = lunes 18:00 UTC.
    - cron: '0 18 * * 1'
  # Permite lanzarlo a mano desde la pestaña Actions (útil para probar el workflow).
  workflow_dispatch:

permissions:
  contents: read

# Si una corrida anterior sigue en curso, no se solapan.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # El cálculo de fechas de los tests usa la zona horaria del proceso Node:
      # se fija la del sitio para que "hoy" sea el mismo día que ve el usuario argentino.
      TZ: America/Argentina/Buenos_Aires

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run UI + API tests
        run: npx playwright test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload API happy path bodies
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-happy-path
          path: test-data/happy-path/
          retention-days: 30
